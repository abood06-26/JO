<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>متجري الرقمي - G2G Style</title>
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #111;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
    }
    .product-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
    }
    .product-card img {
      max-width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }
    .product-card h3 {
      margin: 10px 0;
    }
    .product-card p {
      color: #555;
    }
    .product-card .price {
      font-weight: bold;
      color: #28a745;
      margin: 10px 0;
    }
    .product-card button {
      background-color: #28a745;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .product-card button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

<header>متجر الحسابات والبطاقات الرقمية</header>

<div class="container">

  <div class="product-card">
    <img src="https://via.placeholder.com/250x150" alt="بطاقة ستيم">
    <h3>بطاقة Steam $20</h3>
    <p>بطاقة شحن رصيد لمنصة Steam.</p>
    <div class="price">
